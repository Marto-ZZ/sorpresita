<!-- ============================================================
     LA CARTA — todo el texto de la invitación.
     Cada <section class="slide"> es una tarjeta del carrusel.
     Para agregar una etapa, copiá una section entera: el puntito
     de abajo y las flechas se acomodan solos.
     ============================================================ -->
<template id="tpl-letter">
  <div class="letter carousel" role="dialog" aria-label="La invitación">

    <div class="viewport">
      <div class="track">

        <!-- ---------- 1. la presentación ---------- -->
        <section class="slide">
          <div class="body">
            <h1>Alba,</h1>
            <p class="sub">esto te lo trajo Samy. no preguntes cómo hizo.</p>

            <p class="intro">
              Vos decís que no leés mentes. <br>
              Listo: no hace falta, está todo escrito acá.<br>
              <em>(Bien formal y en prosa, y eso que de los dos, a la que le gusta escribir sos vos)</em>
            </p>

            <p class="nudge">y ahora el plan →</p>
          </div>
        </section>

        <!-- ---------- 2. el heladito ---------- -->
        <section class="slide">
          <div class="body">
            <img class="banner" src="imagenes/luccianos.jpg" width="320" height="200" decoding="async"
                 alt="Lucciano's de Puerto Madero">
            <span class="eyebrow">Etapa 1 — 18:00</span>
            <h2>Lucciano's, Puerto Madero</h2>
            <span class="det">Te invito un heladito, aunque me hayas bardeado los gustos. <br>
              Crema oreo, tiramisú y banana split, tenés los tres. Yo voy a pedir chocolate y te lo vas a tener que bancar.</span>
          </div>
        </section>

        <!-- ---------- 3. el paseo ---------- -->
        <section class="slide">
          <div class="body">
            <img class="banner" src="imagenes/puente.jpg" width="320" height="200" decoding="async"
                 alt="El Puente de la Mujer en Puerto Madero">
            <span class="eyebrow">Etapa 2</span>
            <h2>Paseo bien tranki</h2>
            <span class="det">Caminar por la zona, mirar el agua y seguir la charla sin apuro. Preguntaste si iba a hacer calor: a las seis y al lado del río, no. <br>
            Si me equivoco te debo otro helado.</span>
          </div>
        </section>

        <!-- ---------- 4. la noche de los museos ---------- -->
        <section class="slide">
          <div class="body">
            <img class="banner" src="imagenes/museos.jpg" width="320" height="200" decoding="async"
                 alt="La Noche de los Museos en Buenos Aires">
            <span class="eyebrow">Etapa 3 — (a partir de las 19:00)</span>
            <h2>La Noche de los Museos</h2>
            <span class="det">Abre a las 19 y cierra a las 2 de la mañana, claramente la abuela que se duerme temprano no va a llegar a las 2 con los ojos abiertos. 
            <br> O sea que el helado a las 18 es cálculo, no casualidad (el pibe exactas cuando no calculando todo). La ruta la vamos eligiendo sobre la marcha, total la ciudad se presta para pasear.</span>
          </div>
        </section>

        <!-- ---------- 5. la pregunta ---------- -->
        <section class="slide">
          <div class="body">
            <p class="ask">¿vamos?</p>
            <div class="answers">
              <button class="ans primary" data-a="si">dale, pero sin chocolate</button>

              <!-- sin data-a a propósito: no es una respuesta, se escapa -->
              <div class="escape-zone">
                <button class="ans secondary escapes" type="button">No</button>
              </div>
            </div>
          </div>
        </section>

      </div>
    </div>

    <button class="nav prev" type="button" aria-label="Tarjeta anterior">‹</button>
    <button class="nav next" type="button" aria-label="Tarjeta siguiente">›</button>

    <div class="pager"></div>

  </div>
</template>
