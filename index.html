<!-- EXTOS DE LA BARRITA DE ABAJO -->
<div id="hints" hidden>
  <span data-at="0"><span class="pulse">shhh... está en modo mimir 🤫 acariciálo</span></span>
  <span data-at="12">👀 se despertó. seguí</span> 
  <span data-at="40">🐾 buenos mimos, no pares</span>
  <span data-at="72">😍 <span class="pulse">ahora te mira. no dejes de dar mimos</span></span>

  <span data-at="fetch">🏃 esperá, fue a buscar algo</span>
  <span data-at="brought">💌 te trajo algo</span>
</div>


<!-- EL BOTÓN QUE SE ESCAPA -->
<!-- ============================================================
     A DÓNDE VA LO QUE ELLA ESCRIBA

     Por defecto abre WhatsApp con el mensaje ya tipeado y ella
     solo toca enviar. Poné tu número en data-whatsapp con código
     de país y sin + ni espacios (ej: 5491122334455). Si lo dejás
     vacío, WhatsApp le pregunta a quién mandárselo.

     Si preferís Google Forms: creá el formulario, pedile el link
     de "obtener vínculo con relleno previo", y pegá acá ese link
     cortado justo después de entry.NUMERO= (sin nada atrás).
     Si data-form tiene algo, se usa eso en vez de WhatsApp.
     ============================================================ -->
<div id="destino"
     data-whatsapp=""
     data-form="https://docs.google.com/forms/d/e/1FAIpQLSdM4c_aH1k8K4wekD-KsX8SOtHJxzoC0vDI5ibSyHfzOaYzHw/viewform?usp=pp_url&amp;entry.614633961="
     hidden></div>


<div id="escapes" hidden>
  <span>casi</span>
  <span>nop</span>
  <span>ni ahí</span>
  <span>jaja no</span>
  <span>probá de nuevo</span>
  <span>que no</span>
  <span>dale, decí que sí</span>
</div>


<!-- EL SOBRE -->
<template id="tpl-envelope">
  <div class="env-wrap">
    <button class="envelope" aria-label="Abrir la carta">
      <svg viewBox="0 0 300 206" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="30" width="292" height="172" rx="12" fill="#FFFCF4" stroke="#E8D6B4" stroke-width="3"/>
        <path d="M4 42 L150 140 L296 42" fill="none" stroke="#EADCBD" stroke-width="3"/>
        <path d="M7 196 L150 110 L293 196" fill="#FFF7E8" stroke="#EADCBD" stroke-width="2.5"/>
        <path d="M4 44 L150 4 L296 44 L150 128 Z" fill="#FBE4A9" stroke="#E8CE91" stroke-width="3"/>
        <circle cx="150" cy="106" r="24" fill="#F2A3AE"/>
        <path d="M150 118 c-9 -6 -14 -11 -14 -17 a7 7 0 0 1 14 -3 a7 7 0 0 1 14 3 c0 6 -5 11 -14 17 Z" fill="#FFF7E8"/>
      </svg>
    </button>
    <span class="env-cta">tocá para abrir</span>
  </div>
</template>


<!-- LA CARTA  -->
<template id="tpl-letter">
  <div class="letter carousel" role="dialog" aria-label="La invitación">

    <div class="viewport">
      <div class="track">

        <!-- 1. la presentación -->
        <section class="slide">
          <div class="body">
            <h1>Ro,</h1>
            <p class="sub">te prometí que íbamos a conseguir un pompompurin.</p>

            <p class="intro">
              En el BK no estaba. En el miniso hay, pero sale 50 lucas y siempre se lo lleva una clienta.<br>
              Así que lo hice yo. <em>Este no se agota.</em>
              (no tendrá licencia oficial pero bueno, trabajo honesto)
            </p>

            <p class="nudge">y ahora el plan →</p>
          </div>
        </section>

        <!-- 2. el cafecito -->
        <section class="slide">
          <div class="body">
            <img class="banner" src="imagenes/starbucks.jpeg" alt="Un vaso de Starbucks en la mano">
            <span class="eyebrow">Etapa 1</span>
            <h2>El cafecito</h2>
            <span class="det">Starbucks, el sábado revocate mal cuando salgas y nos vamos a hacer los chetos. Ojo que es 31: último día de octubre, último día para reclamar el cafecito de cumpleaños. O lo canjeás ahora o se te vence. Muy buena excusa para vernos.</span>
          </div>
        </section>

        <!-- 3. jobsbar -->
        <section class="slide">
          <div class="body">
            <img class="banner" src="imagenes/jobs.jpg" alt="El salón de JobsBar con sus mesas largas">
            <span class="eyebrow">Etapa 2</span>
            <h2>JobsBar</h2>
            <span class="det">Pool y jueguitos de mesa. Asi me ves manqueandola como un campeon en el pool (creo que no gane una partidita jamas en mi vida jaja lol). Y la mejor parte: hay sillas. Así tamos comodos y no apoyados en una baranda como dos jubilados (no, no te vas a poder hacer la alta meparece).</span>
          </div>
        </section>

        <!-- 4. el centenario (suspendida) -->
        <section class="slide">
          <div class="body">
            <img class="banner" src="imagenes/centenario.jpg" alt="El lago del Parque Centenario con los patos en la orilla">
            <span class="eyebrow">Etapa 3 (suspendida)</span>
            <h2>El Centenario</h2>
            <span class="det">Los patitos y los peces van a tener que esperar. Pero quedan anotados pa la próxima ;)</span>
          </div>
        </section>

        <!-- 5. la pregunta -->
        <section class="slide">
          <div class="body">
            <p class="ask">¿vamos?</p>
            <div class="answers">
              <button class="ans primary" data-a="si">si y te pago con 1 guiño</button>

              <div class="escape-zone">
                <button class="ans secondary escapes" type="button">No</button>
              </div>
            </div>
          </div>
        </section>

      </div>
    </div>

    <button class="nav prev" type="button" aria-label="Tarjeta anterior">‹</button>
    <button class="nav next" type="button" aria-label="Tarjeta siguiente">›</button>

    <div class="pager"></div>

  </div>
</template>

    <div data-answer="si">
      <p class="big">anotado ✍🏻</p>
      <p class="msg">Un guiño y quedamos a mano.</p>

      <div class="reply">
        <label for="replyText">¿querés agregarme algo?</label>
        <textarea id="replyText" rows="3" maxlength="400"
                  placeholder="escribime lo que quieras..."></textarea>
        <a class="send off" target="_blank" rel="noopener">mandámelo</a>
